name: Deploy

on:
  push:
    branches: ['week*']

permissions:
  contents: read

# All week branches deploy to the same VPS; keep complete runs sequential.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: back
            build_arg: ''
          - service: front
            build_arg: VITE_API_URL
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: printf '%s' "$DOCKER_PASS" | docker login --username "$DOCKER_USER" --password-stdin
      - name: Build and push SHA and latest tags
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          SERVICE: ${{ matrix.service }}
          BUILD_ARG: ${{ matrix.build_arg }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          build_args=()
          if [[ -n "$BUILD_ARG" ]]; then
            : "${VITE_API_URL:?Set repository variable VITE_API_URL}"
            build_args+=(--build-arg "$BUILD_ARG=$VITE_API_URL")
          fi
          image="$DOCKER_USER/todo-$SERVICE"
          docker build --platform linux/amd64 "${build_args[@]}" \
            -t "$image:sha-$GITHUB_SHA" -t "$image:latest" "$SERVICE"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update application on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ~/myapp
            grep -q '^APP_VERSION=' .env.development.compose
            sed -i "s|^APP_VERSION=.*|APP_VERSION=sha-${{ github.sha }}|" .env.development.compose
            docker compose --env-file .env.development.compose pull back front
            docker compose --env-file .env.development.compose up -d --no-deps back front

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Smoke and verify deployed SHA
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          EXPECTED_VERSION: sha-${{ github.sha }}
        run: |
          : "${VITE_API_URL:?Set repository variable VITE_API_URL}"
          api_url="${VITE_API_URL%/}"
          export E2E_BASE_URL="${api_url%/api}"
          printf 'E2E_BASE_URL=%s\n' "$E2E_BASE_URL" > .env.production.e2e
          for attempt in {1..12}; do
            if make smoke-deployed && \
              curl --fail --silent --show-error --max-time 10 "$E2E_BASE_URL/api/health" | \
                node -e 'const h = JSON.parse(require("fs").readFileSync(0, "utf8")); if (h.status !== "ok" || h.version !== process.env.EXPECTED_VERSION) { console.error("Version mismatch:", h.version, "expected", process.env.EXPECTED_VERSION); process.exit(1); } console.log("Verified version:", h.version);'; then
              exit 0
            fi
            echo "Waiting for application startup ($attempt/12)"
            sleep 5
          done
          echo 'Deployed application failed smoke or SHA verification'
          exit 1

  notify:
    needs: [checks, build, deploy, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send deployment status to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          : "${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}"
          : "${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID}"
          if [[ "$CHECKS" != success ]]; then
            status="❌ Type-check: $CHECKS"
          elif [[ "$BUILD" != success ]]; then
            status="❌ Build: $BUILD"
          elif [[ "$DEPLOY" != success ]]; then
            status="❌ Deploy: $DEPLOY"
          elif [[ "$VERIFY" != success ]]; then
            status="❌ Smoke / SHA verification: $VERIFY"
          else
            status='✅ Деплой успешен'
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          text=$(printf '%s\n%s @ %s\nActor: %s\nVersion: sha-%s\n%s' \
            "$status" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_ACTOR" "$GITHUB_SHA" "$run_url")
          response=$(curl --silent --show-error --max-time 30 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            -d 'disable_web_page_preview=true')
          echo "$response"
          echo "$response" | grep -q '"ok":true' || { echo 'Telegram API rejected'; exit 1; }
