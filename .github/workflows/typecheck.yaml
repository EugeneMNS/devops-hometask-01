name: Typecheck

on:
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install deps
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Type-check
        working-directory: ${{ matrix.service }}
        run: npx tsc --noEmit
      # The frontend root tsconfig only lists references, so check them explicitly.
      - name: Type-check frontend projects
        if: matrix.service == 'front'
        working-directory: front
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.node.json
