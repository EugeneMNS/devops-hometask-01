apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-backend-deployer
  namespace: default
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [backend]
    verbs: [get, list, watch, update, patch]
  - apiGroups: ['']
    resources: [services]
    resourceNames: [backend]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-backend-deployer
  namespace: default
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-backend-deployer
