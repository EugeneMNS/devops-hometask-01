# Docker Compose: готовые образы из Docker Hub.
#
# Имя образа для back/front собирается из DOCKERHUB_USERNAME и APP_VERSION —
# их compose берёт из .env.development.compose, который мы передаём флагом --env-file
# (см. Makefile).
#
# В этом файле НИГДЕ не должно быть сборки из исходников: образы должны браться
# готовыми с Docker Hub. Если потребуется собрать — это делает Makefile, не compose.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.development.db
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  back:
    restart: unless-stopped
    image: ${DOCKERHUB_USERNAME}/todo-back:${APP_VERSION}
    platform: linux/amd64
    env_file:
      - .env.development.back
    environment:
      APP_VERSION: ${APP_VERSION}
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app-config:/app/config:ro

  front:
    restart: unless-stopped
    image: ${DOCKERHUB_USERNAME}/todo-front:${APP_VERSION}
    platform: linux/amd64
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      back:
        condition: service_started

volumes:
  pgdata:
